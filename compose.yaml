services:
  checkin:
    build: .
    image: auto-check-in:local
    restart: unless-stopped
    ports:
      - "${CHECKIN_BIND_IP:-127.0.0.1}:18990:18990"
    environment:
      CHECKIN_ACCESS_TOKEN: "${CHECKIN_ACCESS_TOKEN:-}"
      CHECKIN_MASTER_KEY: "${CHECKIN_MASTER_KEY:-}"
      CHECKIN_ALLOW_HTTP: "${CHECKIN_ALLOW_HTTP:-false}"
      CHECKIN_PROXY_URL: "${CHECKIN_PROXY_URL:-}"
    volumes:
      - checkin-data:/data
    shm_size: "512mb"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 45s

volumes:
  checkin-data:
